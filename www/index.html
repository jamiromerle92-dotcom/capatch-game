<!DOCTYPE html>
<html>
<body>
<div id="balance-text">₱50.00</div>
<input type="text" id="userEmail" placeholder="Enter Email">
<input type="text" id="gcashNumber" placeholder="Enter GCash Number">
<button onclick="requestWithdrawal()">Withdraw</button>
<script>
const MIN_WITHDRAW = 60.00;
let userBalance = 50.00;
function requestWithdrawal() {
    let email = document.getElementById("userEmail").value;
    let gcash = document.getElementById("gcashNumber").value;
    if (userBalance < MIN_WITHDRAW) {
        alert("Kulang pa! Kailangan mo ng " + (MIN_WITHDRAW - userBalance) + " pa.");
    } else if (email === "" || gcash === "") {
        alert("Please fill in your Email and GCash number.");
    } else {
        alert("Success! Request sent for " + gcash + ". Please check your email: " + email);
    }
}
</script>
</body>
</html>
